name: PR lint

on:
  pull_request:
    types: [opened, edited, reopened]

permissions:
  contents: read

jobs:
  prlint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: gavinastur/pr-linter-action@792540210e77e26834fefeba3246a539ce83ab56 # v1.2.3

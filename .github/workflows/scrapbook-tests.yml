name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  actions: read
  checks: write
  contents: write
  pull-requests: write

jobs:
  test:
    uses: ./.github/workflows/tests.yml
    with:
      path: "js"
    secrets: inherit
  success:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - run: echo "Workflow successful"